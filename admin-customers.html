<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0c">
<title>Customers — BioLinked Admin</title>
<link rel="icon" type="image/png" href="/favicon.png?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b0c;--surface:#161719;--surface2:#1e1f22;--border:#2e2f31;--border2:#3a3c3f;--text:#ececec;--muted:#9a9c9f;--soft:#6f7174;--gold:#CFB87C;--gold-dark:#B8985A;--gold-glow:rgba(207,184,124,.10);--gold-border:rgba(207,184,124,.32);--ok:#7fbf8e;--bad:#e08f8f}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--gold)}
header{padding:22px 18px 10px;max-width:980px;margin:0 auto;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.05}
h1 em{color:var(--gold);font-style:normal}
.hd-l{flex:1;min-width:200px}
.hd-r{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
main{max-width:980px;margin:0 auto;padding:6px 14px 60px}
.btn{appearance:none;border:1px solid var(--gold-border);background:transparent;color:var(--gold);font:600 13px Montserrat,sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.btn.solid{background:var(--gold);color:#121212;border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 10px;min-height:34px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search]{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:10px 12px;font:500 16px Montserrat,sans-serif;min-height:42px}
input:focus{outline:none;border-color:var(--gold)}
input.err{border-color:var(--bad)}
label.f{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.hidden{display:none!important}
#auth{max-width:420px;margin:30px auto}
#auth h2{font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:4px}
#auth p.s{color:var(--muted);font-size:13px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.linkbtn{background:none;border:none;color:var(--gold);font:500 13px Montserrat,sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline}
.toolbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 0 12px;display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:600 12px Montserrat,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.stats{font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}
.cust{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.cust.dirty{border-color:var(--gold-border)}
.c-top{display:flex;gap:10px;align-items:flex-start}
.c-name{font-weight:700;font-size:16px;flex:1;min-width:0;word-break:break-word}
.c-money{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.c-money b{display:block;color:var(--gold);font-size:15px}
.c-grid{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:8px;margin-top:10px}
#addBox .c-grid{grid-template-columns:1fr 1fr}
@media(max-width:700px){.c-grid{grid-template-columns:1fr 1fr}.c-grid>div:nth-child(2){grid-column:1/-1}}
@media(max-width:480px){.c-grid,#addBox .c-grid{grid-template-columns:1fr}.c-grid>div:nth-child(2){grid-column:auto}}
.c-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
.consent{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.consent input{width:22px;height:22px;accent-color:var(--gold)}
.c-sub{font-size:11.5px;color:var(--soft)}
.pill{font-size:11px;border:1px solid var(--border2);border-radius:999px;padding:3px 8px;color:var(--muted)}
.pill.bad{color:var(--bad);border-color:rgba(224,143,143,.4)}
.portal{margin-left:auto;display:flex;gap:6px;align-items:center}
.portal .sug{color:var(--muted)}
.c-err{color:var(--bad);font-size:12px;margin-top:6px}
.c-save{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#addBox{margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold-border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:90vw}
</style>
</head>
<body>
<header>
  <div class="hd-l">
    <div class="eyebrow">BioLinked Admin · Private</div>
    <h1>Customer <em>Contacts</em></h1>
  </div>
  <div class="hd-r"><a href="/admin.html">Admin Hub</a><span id="who"></span><button class="btn sm hidden" id="signOut" type="button">Sign out</button></div>
</header>
<main>
  <section id="auth" class="card hidden" aria-live="polite">
    <h2 id="authTitle">Sign in</h2>
    <p class="s" id="authSub">Only BioLinked admin accounts can open this page.</p>
    <form id="authForm" autocomplete="on">
      <label class="f" for="aEmail">Email</label>
      <input type="email" id="aEmail" autocomplete="username" required>
      <div id="pwWrap"><label class="f" for="aPass">Password</label>
      <input type="password" id="aPass" autocomplete="current-password" minlength="8" required></div>
      <div class="row" style="margin-top:14px"><button class="btn solid" id="authGo" type="submit">Sign in</button></div>
    </form>
    <div class="row" style="margin-top:8px;gap:14px">
      <button class="linkbtn" id="modeSignup" type="button">First time? Create your admin login</button>
      <button class="linkbtn" id="modeReset" type="button">Forgot password</button>
      <button class="linkbtn hidden" id="modeSignin" type="button">Back to sign in</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div class="toolbar">
      <div class="row"><input type="search" id="q" placeholder="Search name, cell or email" aria-label="Search customers" style="flex:1;min-width:180px"><button class="btn" id="addToggle" type="button">+ Add client</button></div>
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-f="all" aria-pressed="true" type="button">All</button>
        <button class="chip" data-f="nocell" aria-pressed="false" type="button">No cell</button>
        <button class="chip" data-f="cell" aria-pressed="false" type="button">Has cell</button>
        <button class="chip" data-f="consent" aria-pressed="false" type="button">Text OK</button>
        <button class="chip" data-f="noconsent" aria-pressed="false" type="button">Cell, no consent</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="addBox" class="card hidden">
      <div class="c-grid">
        <div><label class="f" for="nName">Name</label><input type="text" id="nName" autocomplete="off"></div>
        <div><label class="f" for="nPhone">Cell</label><input type="tel" id="nPhone" inputmode="tel" placeholder="(720) 555-0123" autocomplete="off"></div>
        <div><label class="f" for="nEmail">Email (optional)</label><input type="email" id="nEmail" autocomplete="off"></div>
        <div><label class="f" for="nSlug">Protocol page slug (optional)</label><input type="text" id="nSlug" placeholder="e.g. jsmith" autocomplete="off" autocapitalize="none"></div>
      </div>
      <div class="c-err" id="nErr"></div>
      <div class="c-save"><button class="btn" id="addCancel" type="button">Cancel</button><button class="btn solid" id="addSave" type="button">Add client</button></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.add('hidden');},2600);}
/* US numbers -> E.164 (+1XXXXXXXXXX). '' stays ''. null = invalid. */
function normPhone(v){v=String(v||'').trim();if(!v)return '';var d=v.replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);if(d.length!==10)return null;if(!/^[2-9]\d{2}[2-9]\d{6}$/.test(d))return null;return '+1'+d;}
function fmtPhone(e){var m=/^\+1(\d{3})(\d{3})(\d{4})$/.exec(e||'');return m?'('+m[1]+') '+m[2]+'-'+m[3]:(e||'');}
function normEmail(v){v=String(v||'').trim().toLowerCase();if(!v)return '';return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?v:null;}
function normSlug(v){v=String(v||'').trim().toLowerCase().replace(/^\/+|\/+$/g,'');if(!v)return '';return /^[a-z0-9][a-z0-9-]*$/.test(v)?v:null;}
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fdate(d){if(!d)return '—';var p=String(d).slice(0,10).split('-');return p.length===3?(+p[1])+'/'+(+p[2])+'/'+p[0].slice(2):'—';}
function suggestSlug(name){
  var t=String(name||'').toLowerCase().replace(/[^a-z\s-]/g,' ').split(/\s+/).filter(Boolean);if(!t.length)return null;
  var first=t[0],rest=t.slice(1),c=[];
  if(rest.length){c.push(first[0]+rest.join('-'));c.push(first[0]+rest[rest.length-1]);c.push(first[0]+rest.join(''));c.push(first[0]+rest[rest.length-1].replace(/-/g,''));c.push(first+rest.join(''));}
  c.push(first);
  for(var i=0;i<c.length;i++){var s=c[i];if(!Object.prototype.hasOwnProperty.call(PORTALS,s))continue;var fn=(PORTALS[s]||'').toLowerCase().split(/\s+/)[0];
    /* the page names a different person (e.g. Ben vs Brittany Hartman): not a match */
    if(fn&&!(fn===first||fn.indexOf(first)===0||first.indexOf(fn)===0))continue;
    if(!fn&&s===first)continue;
    return s;}
  return null;
}
function rpcErr(e){var m=(e&&(e.message||e.details))||String(e);if(/invalid_phone/.test(m))return 'That cell number isn\u2019t a valid US number.';if(/invalid_email/.test(m))return 'That email doesn\u2019t look right.';if(/invalid_slug/.test(m))return 'Slug can only use letters, numbers and dashes.';if(/not_authorised|42501|permission/.test(m))return 'This account isn\u2019t allowed to edit customers.';return 'Save failed: '+m;}

/* ---------- auth ---------- */

  $('authTitle').textContent=m==='signup'?'Create admin login':m==='reset'?'Reset password':m==='newpw'?'Choose a new password':'Sign in';
  $('authGo').textContent=m==='signup'?'Create login':m==='reset'?'Email me a reset link':m==='newpw'?'Save password':'Sign in';

  $('aEmail').closest('form').querySelector('label[for=aEmail]').classList.toggle('hidden',m==='newpw');$('aEmail').classList.toggle('hidden',m==='newpw');$('aEmail').required=m!=='newpw';

async function boot(){
  var g=await sb.auth.getSession(),sess=g.data&&g.data.session;
  if(recovery){show('auth');setMode('newpw');return;}
  if(!sess){$('who').textContent='';show('auth');setMode(mode==='newpw'?'signin':mode);return;}

  $('list').innerHTML='<div class="empty">Loading customers…</div>';

  if(r.error){$('list').innerHTML='<div class="empty">Couldn\u2019t load customers: '+esc(r.error.message)+'</div>';return;}

}
function matches(c,q){if(!q)return true;q=q.toLowerCase();var dq=q.replace(/\D/g,'');return (c.name||'').toLowerCase().indexOf(q)>=0||(c.email||'').toLowerCase().indexOf(q)>=0||(dq.length>=3&&(c.phone||'').replace(/\D/g,'').indexOf(dq)>=0);}
function passFilter(c){if(filter==='cell')return !!c.phone;if(filter==='nocell')return !c.phone;if(filter==='consent')return c.sms_consent&&!c.sms_opted_out;if(filter==='noconsent')return !!c.phone&&!c.sms_consent;return true;}
function card(c){
  var slug=c.portal_slug||c._sug,portal='';
  if(c.portal_slug)portal='<a href="/'+esc(c.portal_slug)+'/" target="_blank" rel="noopener">Protocol page ↗</a>';
  else if(c._sug)portal='<span class="sug">Page?</span> <a href="/'+esc(c._sug)+'/" target="_blank" rel="noopener">/'+esc(c._sug)+'/</a> <button class="btn sm" data-act="link" type="button">Link</button>';
  else portal='<span class="c-sub">No protocol page linked</span>';
  var consentSub=c.sms_opted_out?'<span class="pill bad">Opted out</span>':c.sms_consent?'<span class="c-sub">'+esc(c.sms_consent_method||'verbal')+' · '+fdate(c.sms_consent_at)+'</span>':'';
  return '<div class="cust" data-id="'+esc(c.id)+'">'+
    '<div class="c-top"><div class="c-name">'+esc(c.name)+'</div><div class="c-money"><b>'+money(c.total_spent)+'</b>'+(c.orders?c.orders+' sale'+(c.orders===1?'':'s')+' · last '+fdate(c.last_order):'no sales yet')+'</div></div>'+
    '<div class="c-grid"><div><label class="f">Cell</label><input type="tel" inputmode="tel" data-k="phone" value="'+esc(fmtPhone(c.phone))+'" placeholder="Add cell" autocomplete="off"></div>'+
    '<div><label class="f">Email (optional)</label><input type="email" data-k="email" value="'+esc(c.email||'')+'" placeholder="Add email" autocomplete="off"></div>'+
    '<div><label class="f">Protocol page slug</label><input type="text" data-k="slug" value="'+esc(c.portal_slug||'')+'" placeholder="'+esc(c._sug||'e.g. jsmith')+'" autocomplete="off" autocapitalize="none" spellcheck="false"></div></div>'+
    '<div class="c-err hidden"></div>'+
    '<div class="c-save hidden"><button class="btn sm" data-act="cancel" type="button">Cancel</button><button class="btn sm solid" data-act="save" type="button">Save</button></div>'+
    '<div class="c-foot"><label class="consent"><input type="checkbox" data-act="consent"'+(c.sms_consent&&!c.sms_opted_out?' checked':'')+(c.phone?'':' disabled')+'> Texts OK</label>'+consentSub+
    (c.sms_opted_out?' <button class="linkbtn" data-act="optin" type="button">Clear opt-out</button>':(c.sms_consent?' <button class="linkbtn" data-act="optout" type="button">Mark opted out</button>':''))+
    '<div class="portal">'+portal+'</div></div></div>';
}
function render(){
  var q=$('q').value.trim(),list=rows.filter(function(c){return passFilter(c)&&matches(c,q);});
  var cell=rows.filter(function(c){return c.phone;}).length,ok=rows.filter(function(c){return c.phone&&c.sms_consent&&!c.sms_opted_out;}).length;
  $('stats').textContent=rows.length+' clients · '+cell+' with a cell · '+ok+' OK to text'+(list.length!==rows.length?' · showing '+list.length:'');
  $('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No customers match.</div>';
}
function byId(id){for(var i=0;i<rows.length;i++)if(String(rows[i].id)===String(id))return rows[i];return null;}
$('q').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});render();};});
$('list').addEventListener('input',function(e){var el=e.target.closest('[data-k]');if(!el)return;var box=el.closest('.cust');box.classList.add('dirty');box.querySelector('.c-save').classList.remove('hidden');});
$('list').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('[data-k]')){e.preventDefault();var b=e.target.closest('.cust').querySelector('[data-act=save]');if(b)b.click();}});
$('list').addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var box=b.closest('.cust'),c=byId(box.dataset.id);if(!c)return;var act=b.dataset.act,err=box.querySelector('.c-err');
  if(act==='cancel'){render();return;}
  if(act==='save'||act==='link'){
    var pIn=box.querySelector('[data-k=phone]'),eIn=box.querySelector('[data-k=email]'),sIn=box.querySelector('[data-k=slug]');
    var ph=act==='link'?(c.phone||''):normPhone(pIn.value),em=act==='link'?(c.email||''):normEmail(eIn.value),slug=act==='link'?c._sug:normSlug(sIn.value);
    pIn.classList.toggle('err',ph===null);eIn.classList.toggle('err',em===null);sIn.classList.toggle('err',slug===null);
    if(ph===null||em===null||slug===null){err.textContent=ph===null?'Enter a 10-digit US cell, e.g. (720) 555-0123.':em===null?'That email doesn\u2019t look right.':'Slug can only use letters, numbers and dashes.';err.classList.remove('hidden');return;}
    b.disabled=true;
    var r=await sb.rpc('admin_save_customer',{p_id:c.id,p_name:c.name,p_phone:ph||null,p_email:em||null,p_portal_slug:slug||null});b.disabled=false;
    if(r.error){err.textContent=rpcErr(r.error);err.classList.remove('hidden');return;}
    c.phone=r.data.phone;c.email=r.data.email;c.portal_slug=r.data.portal_slug;c._sug=c.portal_slug?null:suggestSlug(c.name);
    if(!c.phone&&c.sms_consent){c.sms_consent=false;}
    render();toast(act==='link'?'Protocol page linked.':'Saved '+c.name+'.');return;
  }
  if(act==='consent'){var want=b.checked;b.disabled=true;var r2=await sb.rpc('admin_set_sms_consent',{p_id:c.id,p_consent:want});
    if(r2.error){b.checked=!want;b.disabled=false;toast(rpcErr(r2.error));return;}Object.assign(c,r2.data);render();toast(want?'Text consent recorded (verbal).':'Text consent removed.');return;}
  if(act==='optout'||act==='optin'){var r3=await sb.rpc('admin_set_sms_opt_out',{p_id:c.id,p_opted_out:act==='optout'});if(r3.error){toast(rpcErr(r3.error));return;}Object.assign(c,r3.data);render();toast(act==='optout'?'Marked opted out.':'Opt-out cleared.');}
});
$('addToggle').onclick=function(){$('addBox').classList.toggle('hidden');if(!$('addBox').classList.contains('hidden'))$('nName').focus();};
$('addCancel').onclick=function(){$('addBox').classList.add('hidden');};
$('addSave').onclick=async function(){
  var n=$('nName').value.trim(),ph=normPhone($('nPhone').value),em=normEmail($('nEmail').value),sl=normSlug($('nSlug').value),er=$('nErr');
  er.textContent='';if(!n){er.textContent='Name is required.';return;}if(ph===null){er.textContent='Enter a 10-digit US cell, e.g. (720) 555-0123.';return;}if(em===null){er.textContent='That email doesn\u2019t look right.';return;}if(sl===null){er.textContent='Slug can only use letters, numbers and dashes.';return;}
  if(rows.some(function(c){return (c.name||'').trim().toLowerCase()===n.toLowerCase();})&&!confirm(n+' is already on the list. Add another client with the same name?'))return;
  $('addSave').disabled=true;var r=await sb.rpc('admin_save_customer',{p_id:null,p_name:n,p_phone:ph||null,p_email:em||null,p_portal_slug:sl||null});$('addSave').disabled=false;
  if(r.error){er.textContent=rpcErr(r.error);return;}
  ['nName','nPhone','nEmail','nSlug'].forEach(function(k){$(k).value='';});$('addBox').classList.add('hidden');toast('Added '+n+'.');await load();
};
setMode('signin');boot();
})();
</script>
</body>
</html>
