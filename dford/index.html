<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f5f5f5;color:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:#fff;border:1px solid rgba(0,0,0,0.14);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 6px 22px rgba(0,0,0,.06);padding:34px 30px;max-width:420px;width:100%}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.04em;line-height:1}
.sub{font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#7A6530;margin-top:5px}
.msg{font-size:14px;line-height:1.65;color:#4a4a44;margin-top:22px;padding-top:20px;border-top:1px solid rgba(0,0,0,.14)}
.msg strong{color:#000;font-weight:700}
.go{display:inline-block;margin-top:20px;background:#7A6530;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:13px 22px;border-radius:5px;text-decoration:none}
.go:hover{background:#5f4f26}
</style>

<body>
<div class="card">
  <div class="brand">BioLinked</div>
  <div class="sub">Peptide Solutions</div>
  <div class="msg">This protocol has moved to its <strong>updated address</strong>. Taking you there now &mdash; update your bookmark or re-add it to your home screen.</div>
  <a class="go" href="/dforden/">Open Your Protocol &rarr;</a>
</div>
<script>
// Release the old service worker and its cache so the stale page cannot be
// served from under the redirect, then move to the new slug.
(function(){
  var dest='/dforden/';
  try{localStorage.removeItem('bl-pwa-dismiss-dford');}catch(e){}
  function go(){location.replace(dest);}
  if('serviceWorker' in navigator){
    var done=false, finish=function(){if(!done){done=true;go();}};
    setTimeout(finish,1200);
    navigator.serviceWorker.getRegistrations()
      .then(function(rs){return Promise.all(rs.map(function(r){
        return (r.scope.indexOf('/dford/')!==-1)?r.unregister():null;}));})
      .then(function(){return caches.keys();})
      .then(function(ks){return Promise.all(ks.filter(function(k){
        return k.indexOf('dford-')===0;}).map(function(k){return caches.delete(k);}));})
      .then(finish).catch(finish);
  } else { go(); }
})();
</script>
