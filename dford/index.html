</div>
<script>
// Release the old service worker and its cache so the stale page cannot be
// served from under the redirect, then move to the new slug.
(function(){
  var dest='/dforden/';
  try{localStorage.removeItem('bl-pwa-dismiss-dford');}catch(e){}
  function go(){location.replace(dest);}
  if('serviceWorker' in navigator){
    var done=false, finish=function(){if(!done){done=true;go();}};
    setTimeout(finish,1200);
    navigator.serviceWorker.getRegistrations()
      .then(function(rs){return Promise.all(rs.map(function(r){
        return (r.scope.indexOf('/dford/')!==-1)?r.unregister():null;}));})
      .then(function(){return caches.keys();})
      .then(function(ks){return Promise.all(ks.filter(function(k){
        return k.indexOf('dford-')===0;}).map(function(k){return caches.delete(k);}));})
      .then(finish).catch(finish);
  } else { go(); }
})();
</script>

<!-- mobile-floor -->
<script>
/* wide-table scroll wrapper — bl-theme.js carries this for themed pages */
(function(){function w(){if(!window.matchMedia||!matchMedia('(max-width:640px)').matches)return;
var t=document.querySelectorAll('table');for(var i=0;i<t.length;i++){var e=t[i];
if(!e.parentNode||e.parentNode.classList.contains('bl-scroll-x'))continue;
var a=e.parentNode.clientWidth;if(!a||e.scrollWidth<=a+1)continue;
var b=document.createElement('div');b.className='bl-scroll-x';e.parentNode.insertBefore(b,e);b.appendChild(e);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',w);else w();
addEventListener('load',w);setTimeout(w,600);addEventListener('resize',w);})();
</script>
<style>
/* Universal mobile floor — nothing on this page renders under 11px and no
   control is under 44px. Selectors are pinned to max(11px, the largest size
   this page declares), so the floor can only ever raise type. */
@media(max-width:640px){
  body{font-size:17px !important;line-height:1.55 !important;}
  input,select,textarea{font-size:16px !important;}
  [style*="font-size:9px"],[style*="font-size:9.5px"],[style*="font-size:10px"],
  [style*="font-size: 9px"],[style*="font-size: 9.5px"],[style*="font-size: 10px"]{font-size:11px !important;}
  button, summary, select, textarea,
  input:not([type=checkbox]):not([type=radio]):not([type=hidden]),
  [role="button"],
  .tab-btn,.nav-tab,.filter-tab,.tab,.ltab,.menu-btn,.menu-item,
  .btn,.btn-sm,.btn-ghost,.btn-primary,.btn-secondary,.btn-outline,.btn-gold,
  .btn-danger,.btn-danger-sm,.nbtn,.sbtn,.fbtn,.vbtn,.fchip,
  .nut-chip,.nut-btn,.nut-seg-btn,.action-btn,.export-btn,.modal-close,
  .week-nav-btn,.sheet-status-btn,.wh-btn,.trk-abtn,.trk-wnav,.trk-cal-dl,
  .bl-dropdown-btn,.bl-nav-link,.bl-nav-mobile-link,.bl-nav-mobile-btn,
  .bl-nav-mobile-sub,.bl-pwa-banner-btn,.bl-pwa-install,.bl-pwa-dismiss,
  .cal-dl-btn,.supply-link,.checklist-link,.resource-link,.order-btn,
  .view-details-btn,.pay-btn,.gate-btn,.upload-btn,.lab-upload-btn,
  .ai-gen-btn,.add-level-btn,.logout-btn,.proto-btn,.proto-card,
  .res-card,.topic-card,.tool-card,.form-select,.inv-switcher-select,
  .tip-head,.sched-card-head,.lab-section-head,.cyc-head,.ci,
  a.pill,button.pill,label.lbl,label.form-label{min-height:44px !important;}
  .supply-link,.checklist-link,.resource-link,.bl-nav-link,
  .view-details-btn,.order-btn,.btn-sm,.btn-danger-sm,a.pill,
  .fchip,.nut-chip{display:inline-flex !important;align-items:center;justify-content:center;}
  .bl-nav-logo,.site-nav-logo{min-height:44px !important;}
  #bl-bio-top-link,[aria-label="Open Biomarker Analyzer"]{min-height:44px !important;}
  div[style*="flex-direction:column"] > a,
  .field > label,.fld > label{min-height:44px !important;display:flex;align-items:center;}
  /* wide tables: bl-theme.js wraps only the ones that actually overflow */
  .bl-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
  /* horizontal tab strips scroll rather than pushing the document sideways */
  .tabs-inner,.tab-row,.tabs,.tab-bar,.tab-strip{overflow-x:auto !important;max-width:100%;}
  /* full-bleed negative margins have nothing to bleed into once body padding is 0 */
  .bl-nav{margin-left:0 !important;margin-right:0 !important;}
  /* controls the class list missed */
  label.pill,.back,.qv a{min-height:44px !important;}
  .back{display:inline-flex !important;align-items:center;}
  /* inline prose links: vertical padding grows the touch area without
     breaking the line, which min-height on an inline box cannot do */
  a:not([class]):not([id]):not([aria-label="Open Biomarker Analyzer"]),
  .qv a,.attribution-text a,.footer-note a{padding-top:15px !important;padding-bottom:15px !important;}
  /* nowrap brand lines cannot fit 390px, and they set the footer's width */
  .footer-brand,.inv-footer,.footer-disc{white-space:normal !important;max-width:100% !important;}
  /* backstop: overflow-x clip (not hidden) keeps position:sticky working */
  html,body{overflow-x:clip !important;max-width:100% !important;}
  /* checkbox and radio glyphs sit inside a 44px label row (.ci); 44px on the
     glyph itself would dwarf the form, so they get a 24px touch-sized box */
  input[type=checkbox],input[type=radio]{width:24px !important;height:24px !important;}


  .go,.sub{font-size:11px !important;}
}
