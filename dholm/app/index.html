<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6">
<title>BioLinked &middot; Drew Holm</title>
<meta name="robots" content="noindex">
<!-- The pilot moved to /dholm/, which is now the real protocol page.
     This is a redirect rather than a 404 so an installed copy of the pilot
     lands on the live page instead of breaking. -->
<meta http-equiv="refresh" content="0; url=/dholm/">
<link rel="canonical" href="https://biolinkedsolutions.com/dholm/">
<link rel="apple-touch-icon" href="/icon-192.png?v=6">
<link rel="icon" type="image/png" href="/icon-192.png?v=6">
<style>
  html,body{margin:0;height:100%;background:#fbfaf6;color:#211d16;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .c{max-width:22em}
  h1{font-family:'Hoefler Text',Georgia,serif;font-size:24px;margin:0 0 8px;letter-spacing:-.2px}
  p{font-size:13.5px;line-height:1.6;color:#8c8578;margin:0 0 18px}
  a{display:inline-block;background:#8a7338;color:#fff;text-decoration:none;
    padding:13px 22px;border-radius:13px;font-size:13.5px;font-weight:800}
</style>
</head>
<body>
  <div class="w"><div class="c">
    <h1>Your protocol has moved</h1>
    <p>This pilot now lives at its permanent address. Taking you there&hellip;</p>
    <a href="/dholm/">Open my protocol</a>
  </div></div>
<script>
/* Retire the pilot cleanly: drop its service worker and caches so an installed
   copy cannot keep serving the old build, then go to the real page. The
   redirect happens either way -- the cleanup never blocks it. */
(function(){
  var go=function(){ location.replace('/dholm/'); };
  var done=false, fire=function(){ if(done) return; done=true; go(); };
  setTimeout(fire, 1200);                       /* never hang on cleanup */
  try{
    var jobs=[];
    if('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){
          return r.scope.indexOf('/dholm/app/')!==-1;
        }).map(function(r){ return r.unregister(); }));
      }).catch(function(){}));
    }
    if(window.caches && caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.filter(function(k){ return k.indexOf('dholm-app-')===0; })
                             .map(function(k){ return caches.delete(k); }));
      }).catch(function(){}));
    }
    Promise.all(jobs).then(fire, fire);
  }catch(e){ fire(); }
})();
</script>
</body>
</html>
